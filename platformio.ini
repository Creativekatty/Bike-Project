; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = radar_test_freenove

; Waveshare ESP32-S3-SIM7670G-4G (ESP32-S3 with 8MB octal PSRAM)
; No official PlatformIO board exists, so use the generic S3 DevKitC and override memory.
[env:waveshare_esp32s3_sim7670g]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; USB-C goes through a CH343 USB-serial chip (COM9); COM4-7 are the SIM7670G modem.
; Windows can renumber the CH343 port - check Device Manager if uploads fail.
upload_protocol = esptool
upload_port = COM9
upload_speed = 115200
monitor_port = COM9
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit NeoPixel

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

; Main bike light program (lights + speaker)
build_src_filter = +<*> -<speaker_test.cpp> -<i2c_scan.cpp> -<imu_test.cpp> -<radar_test.cpp> -<lora_test.cpp> -<radar_node.cpp> -<hello_test.cpp>

; Speaker test program - pick "env:speaker_test" in the PlatformIO env selector
[env:speaker_test]
extends = env:waveshare_esp32s3_sim7670g
build_src_filter = +<speaker.cpp> +<speaker_test.cpp>

; I2C scanner - lists devices on the board's I2C bus
[env:i2c_scan]
extends = env:waveshare_esp32s3_sim7670g
build_src_filter = +<i2c_scan.cpp>

; MPU-6050 (GY-521) IMU test
[env:imu_test]
extends = env:waveshare_esp32s3_sim7670g
build_src_filter = +<imu_test.cpp>

; HLK-LD2451 24 GHz vehicle radar test
[env:radar_test]
extends = env:waveshare_esp32s3_sim7670g
build_src_filter = +<radar_test.cpp>

; Ebyte E32-915T20D LoRa test for the BIKE unit - runs on the WAVESHARE board.
; Same program as lora_test, built with the bike pins and name.
[env:lora_bike_test]
extends = env:waveshare_esp32s3_sim7670g
build_flags =
    ${env:waveshare_esp32s3_sim7670g.build_flags}
    -DLORA_BIKE
build_src_filter = +<lora_test.cpp>

; Ebyte E32-915T20D LoRa test - runs on the FREENOVE ESP32-S3 board, not the Waveshare.
; Use the board's "UART" USB-C port. If both boards are plugged in, set upload_port
; and monitor_port below to the Freenove's COM port.
[env:lora_test]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<lora_test.cpp>

; Ebyte E32-915T20D LoRa test on a classic ESP32 WROOM dev board (ESP32-DevKitC style).
; Plugged in through the external USB extender; most WROOM boards use a CP2102/CH340
; USB-serial chip. Set upload_port/monitor_port to its COM port if auto-detect picks
; the wrong one (e.g. the Waveshare on COM3).
; Wiring: E32 TXD->GPIO16, RXD->GPIO17, M0->GPIO25, M1->GPIO26, AUX->GPIO27
[env:lora_esp32_wroom]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800   ; drop to 115200 if uploads fail over the extender
;upload_port = COM8
;monitor_port = COM8
build_flags = -DLORA_ESP32_WROOM
build_src_filter = +<lora_test.cpp>

; Radar node on the small D1 Mini ESP32 (ESP-WROOM-32, Type-C): reads the LD2451 radar and
; sends the results over the E32 LoRa module. See the wiring at the top of radar_node.cpp.
; Set upload_port/monitor_port to this board's COM port if auto-detect picks the wrong one.
[env:radar_node]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
build_src_filter = +<radar_node.cpp>

; HLK-LD2451 radar test on the FREENOVE ESP32-S3 (COM8): radar TX wire on GPIO16, RX wire on GPIO17.
[env:radar_test_freenove]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0 -DRADAR_FREENOVE
build_src_filter = +<radar_test.cpp>

; Hello World test on the Waveshare board (prints a line every second)
[env:hello_waveshare]
extends = env:waveshare_esp32s3_sim7670g
upload_port = COM9
monitor_port = COM9
build_src_filter = +<hello_test.cpp>
